- name: consiguring and enabling rabbit mq service
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copying and setting up rabbit mq repo
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

  - name: installing rabbitmq
    package:
      name: rabbitmq-server
      state: present
  
  - name: enabling and starting rabbitmq server
    service:
      name: rabbitmq-server
      state: started
      enabled: yes

  - name: setting up password and permissions
    community.rabbitmq.rabbitmq_user:
        user: "roboshop "
        password: "roboshop123"
        vhost: "/"
        configure_priv: ".*"
        write_priv: ".*"
        read_priv: ".*"
        state: present