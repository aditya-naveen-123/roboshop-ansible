- name: creating and hosting mongodb
  hosts: mongodb
  become: yes
  tasks:
  - name: copying mongo repo to the destination
    copy: 
      src: Ansible/roboshop-ansible/mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
      remote_src: true

  - name: install mongo db package
    package:
      name: mongodb-org
      state: present
  - name: starting and enabling mongodb
    service:
      name: mongod
      state: installed
      enabled: yes



