- name: Create and manage roboshop instances
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "catalogue", "frontend", "redis", "user", "cart", "shipping", "mysql", "rabbitmq", "payment"]
    image_id: "ami-0220d79f3f480ecf5"
    domain_name: "adityabuilds.fun"
  tasks:
  - name: create EC2 instances from list
    amazon.aws.ec2_instance:
        instance_type: t3.micro
        image_id: "{{image_id}}"
        name: "roboshop-{{item}}"
        security_groups:
        - "roboshop-{{item}}"
        - roboshop-common
    loop: "{{instances}}"
    register: ec2_output

  # - name: print output
  #   debug:
  #     msg: "{{ec2_output}}"\
  # - name: create and update R53 records
  #   debug:
  #     msg: "Instance Name is: {{item.item}}, Private Ip: {{item.instances[0].private_ip_address}}"
  #   loop: "{{ec2_output.results}}"

  - name: create and update R53 records
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{item.item}}.{{domain_name}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: item.item != "frontend"

  - name: Updating record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{domain_name}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].public_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: item.item == "frontend"