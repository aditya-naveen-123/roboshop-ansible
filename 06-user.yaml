- name: configuring user service
  hosts: user
  become: yes
  tasks:
  - name: Enabling node js version 20
    command: dnf module enable nodejs:20 -y
  - name: Intsalling node js
    package:
      name: nodejs
      state: present

  - name: creating roboshop system user
    user:
      name: roboshop
      system: true
      shell: /sbin/nologin
      home: /app
      comment: "roboshop system user"

  - name: remove an app directory
    file:
      path: /app
      state: absent

  - name: delete code zip file in temp
    file:
      path: /tmp/user.zip
      state: absent

  - name: create an app directory
    file:
      path: /app
      state: directory

  - name: create code directory
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip "
      dest: "/tmp/user.zip"

  - name: unzip downloaded code
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: true
  - name: installing npm dependencies
    community.general.npm:
      path: /app
      state: present

  - name: creating user service file
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service

  - name: mongo db deamon reload
    systemd_service:
      name: user
      daemon_reload: true

  - name: start and enable user service
    service:
      name: user
      state: restarted
      enabled: yes
