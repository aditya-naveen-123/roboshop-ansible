- name: Configuring and enabling payment services
  hosts: payment
  become: yes
  tasks:
  - name: install python
    package:
      name: "{{item}}"
      state: present
    loop:
    - python3
    - gcc
    - python3-devel

  - name: adding roboshop system user
    user:
      name: roboshop
      system: true
      shell: /sbin/nologin
      home: /app
      comment: "roboshop system user"

  - name: remove an app directory
    file:
      path: /app
      state: absent

  - name: delete code zip file in temp
    file:
      path: /tmp/payment.zip
      state: absent

  - name: create an app directory
    file:
      path: /app
      state: directory

  - name: create code directory
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip "
      dest: "/tmp/payment.zip"

  - name: unzip downloaded code
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: true

  - name: install python required dependencies
    pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app

  - name: creating payment service file
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service

  

  - name: payment deamon reload
    systemd_service:
      name: payment
      daemon_reload: true

  - name: start and enable payment service
    service:
      name: payment
      state: restarted
      enabled: yes
